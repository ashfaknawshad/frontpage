apiVersion: batch/v1
kind: CronJob
metadata:
  name: monitor
spec:
  schedule: "20 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 900
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
          containers:
            - name: monitor
              image: ghcr.io/ashfaknawshad/frontpage-jobs:sha-9cc8003
              args: ["jobs.monitor"]
              env:
                - { name: PGHOST, value: pg-rw.data.svc.cluster.local }
                - { name: PGDATABASE, value: frontpage }
                - name: PGUSER
                  valueFrom: { secretKeyRef: { name: pg-frontpage, key: username } }
                - name: PGPASSWORD
                  valueFrom: { secretKeyRef: { name: pg-frontpage, key: password } }
                - { name: MLFLOW_URL, value: "http://mlflow.mlflow.svc.cluster.local" }
                - { name: GITHUB_REPOSITORY, value: "ashfaknawshad/frontpage" }
                - { name: AUTO_RETRAIN, value: "false" }
                - name: GITHUB_DISPATCH_TOKEN
                  valueFrom: { secretKeyRef: { name: github-dispatch, key: GITHUB_DISPATCH_TOKEN, optional: true } }
              resources:
                requests: { cpu: 20m, memory: 96Mi }
                limits: { memory: 256Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
