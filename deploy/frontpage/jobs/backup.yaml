apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-backup
  namespace: data
spec:
  schedule: "30 20 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: Never
          securityContext:
            fsGroup: 10001
          volumes:
            - name: backup
              emptyDir: {}
          initContainers:
            - name: dump-frontpage
              image: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
              command: ["pg_dump", "--format=custom", "--no-owner", "--file=/backup/frontpage.dump"]
              env:
                - { name: PGHOST, value: pg-rw.data.svc.cluster.local }
                - { name: PGDATABASE, value: frontpage }
                - name: PGUSER
                  valueFrom: { secretKeyRef: { name: pg-frontpage, key: username } }
                - name: PGPASSWORD
                  valueFrom: { secretKeyRef: { name: pg-frontpage, key: password } }
              volumeMounts:
                - { name: backup, mountPath: /backup }
              resources:
                requests: { cpu: 20m, memory: 64Mi }
                limits: { memory: 256Mi }
            - name: dump-mlflow
              image: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
              command: ["pg_dump", "--format=custom", "--no-owner", "--file=/backup/mlflow.dump"]
              env:
                - { name: PGHOST, value: pg-rw.data.svc.cluster.local }
                - { name: PGDATABASE, value: mlflow }
                - name: PGUSER
                  valueFrom: { secretKeyRef: { name: pg-mlflow, key: username } }
                - name: PGPASSWORD
                  valueFrom: { secretKeyRef: { name: pg-mlflow, key: password } }
              volumeMounts:
                - { name: backup, mountPath: /backup }
              resources:
                requests: { cpu: 20m, memory: 64Mi }
                limits: { memory: 256Mi }
          containers:
            - name: upload
              image: ghcr.io/ashfaknawshad/frontpage-jobs:sha-0000000
              args: ["jobs.backup"]
              envFrom:
                - secretRef:
                    name: dagshub-s3
              volumeMounts:
                - { name: backup, mountPath: /backup, readOnly: true }
              resources:
                requests: { cpu: 20m, memory: 64Mi }
                limits: { memory: 256Mi }
              securityContext:
                runAsNonRoot: true
                runAsUser: 10001
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
