apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus
    targetRevision: 29.40.3
    helm:
      valuesObject:
        alertmanager:
          enabled: false
        prometheus-pushgateway:
          enabled: false
        kube-state-metrics:
          enabled: true
          resources:
            requests: { cpu: 10m, memory: 48Mi }
            limits: { memory: 128Mi }
        prometheus-node-exporter:
          enabled: true
          resources:
            requests: { cpu: 10m, memory: 24Mi }
            limits: { memory: 64Mi }
        server:
          global:
            scrape_interval: 30s
            scrape_timeout: 10s
            evaluation_interval: 1m
          retention: 10d
          retentionSize: 4GB
          persistentVolume:
            enabled: true
            size: 6Gi
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 640Mi }
        configmapReload:
          prometheus:
            resources:
              requests: { cpu: 5m, memory: 16Mi }
              limits: { memory: 32Mi }
        scrapeConfigs:
          kubernetes-api-servers: { enabled: false }
          kubernetes-services: { enabled: false }
          prometheus-pushgateway: { enabled: false }
          kubernetes-pods-slow: { enabled: false }
          kubernetes-service-endpoints-slow: { enabled: false }
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 10
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }
