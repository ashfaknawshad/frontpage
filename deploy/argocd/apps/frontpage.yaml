apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontpage
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: https://github.com/ashfaknawshad/frontpage.git
    targetRevision: main
    path: deploy/frontpage
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: frontpage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }
