apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-drift
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  drift.json: |
    {
      "uid": "fp-drift",
      "title": "Frontpage / Drift and retraining",
      "description": "Daily comparison of live data with the training data, live model quality, and what the monitor decided.",
      "tags": [
        "frontpage",
        "drift",
        "retraining"
      ],
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "graphTooltip": 1,
      "refresh": "1m",
      "time": {
        "from": "now-14d",
        "to": "now"
      },
      "timezone": "utc",
      "templating": {
        "list": []
      },
      "annotations": {
        "list": []
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Latest daily check",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Drifted features",
          "description": "Features with PSI of 0.2 or more against the training data. 3 or more counts as drift.",
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "postgres"
          },
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "postgres"
              },
              "rawSql": "SELECT drifted_features AS value FROM monitor_runs WHERE drifted_features IS NOT NULL ORDER BY ts DESC LIMIT 1",
              "format": "table",
              "rawQuery": true,
              "editorMode": "code"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 3
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto"
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Decision",
          "description": "none, would_trigger (dry run), triggered, cooldown or dispatch_failed.",
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "postgres"
          },
          "gridPos": {
            "x": 4,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "postgres"
              },
              "rawSql": "SELECT action AS value FROM monitor_runs ORDER BY ts DESC LIMIT 1",
              "format": "table",
              "rawQuery": true,
              "editorMode": "code"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto"
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Live ROC-AUC (champion)",
          "description": "Graded stories from the last 14 days, scored by the champion.",
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "postgres"
          },
          "gridPos": {
            "x": 8,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "postgres"
              },
              "rawSql": "SELECT round(champion_roc_auc::numeric, 3) AS value FROM monitor_runs WHERE champion_roc_auc IS NOT NULL ORDER BY ts DESC LIMIT 1",
              "format": "table",
              "rawQuery": true,
              "editorMode": "code"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto"
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Test ROC-AUC (reference)",
          "description": "What the champion scored on held-out data when it was trained. A live value below 90% of this triggers a retrain.",
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "postgres"
          },
          "gridPos": {
            "x": 12,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "postgres"
              },
              "rawSql": "SELECT round(reference_roc_auc::numeric, 3) AS value FROM monitor_runs WHERE reference_roc_auc IS NOT NULL ORDER BY ts DESC LIMIT 1",
              "format": "table",
              "rawQuery": true,
              "editorMode": "code"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto"
          }
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Hit rate, live",
          "description": "Share of recent graded stories that reached 100 points.",
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "postgres"
          },
          "gridPos": {
            "x": 16,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "postgres"
              },
              "rawSql": "SELECT round((100 * base_rate_live)::numeric, 2) AS value FROM monitor_runs WHERE base_rate_live IS NOT NULL ORDER BY ts DESC LIMIT 1",
              "format": "table",
              "rawQuery": true,
              "editorMode": "code"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto"
          }
        },
        {
          "id": 7,
          "type": "stat",
          "title": "Hit rate, training",
          "description": "Share of training stories that reached 100 points.",
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "postgres"
          },
          "gridPos": {
            "x": 20,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "postgres"
              },
              "rawSql": "SELECT round((100 * base_rate_ref)::numeric, 2) AS value FROM monitor_runs WHERE base_rate_ref IS NOT NULL ORDER BY ts DESC LIMIT 1",
              "format": "table",
              "rawQuery": true,
              "editorMode": "code"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto"
          }
        },
        {
          "id": 8,
          "type": "row",
          "title": "Input drift (PSI against the training data)",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 5,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 9,
          "type": "table",
          "title": "Latest PSI by feature",
          "description": "PSI under 0.1 is stable, 0.1 to 0.2 worth watching, 0.2 or more is a real shift.",
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "postgres"
          },
          "gridPos": {
            "x": 0,
            "y": 6,
            "w": 12,
            "h": 9
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "postgres"
              },
              "rawSql": "SELECT feature, round(psi::numeric, 3) AS psi, CASE WHEN psi >= 0.2 THEN 'drifted' WHEN psi >= 0.1 THEN 'watch' ELSE 'stable' END AS status, detail AS reference_to_live FROM monitor_psi WHERE run_id = (SELECT max(run_id) FROM monitor_psi) ORDER BY psi DESC",
              "format": "table",
              "rawQuery": true,
              "editorMode": "code"
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {
            "showHeader": true
          }
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "PSI over time",
          "description": "",
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "postgres"
          },
          "gridPos": {
            "x": 12,
            "y": 6,
            "w": 12,
            "h": 9
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "postgres"
              },
              "rawSql": "SELECT r.ts AS time, p.feature AS metric, p.psi FROM monitor_psi p JOIN monitor_runs r ON r.id = p.run_id WHERE $__timeFilter(r.ts) ORDER BY 1",
              "format": "time_series",
              "rawQuery": true,
              "editorMode": "code"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 0,
                "showPoints": "always"
              },
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 11,
          "type": "row",
          "title": "Live model quality",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 15,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "ROC-AUC on graded stories, by model",
          "description": "Ranking quality, which does not depend on the base rate.",
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "postgres"
          },
          "gridPos": {
            "x": 0,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "postgres"
              },
              "rawSql": "SELECT r.ts AS time, m.role || ' v' || m.model_version AS metric, m.roc_auc FROM monitor_model m JOIN monitor_runs r ON r.id = m.run_id WHERE m.roc_auc IS NOT NULL AND $__timeFilter(r.ts) ORDER BY 1",
              "format": "time_series",
              "rawQuery": true,
              "editorMode": "code"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 0,
                "showPoints": "always"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 13,
          "type": "timeseries",
          "title": "Brier score on graded stories, by model",
          "description": "Lower is better. Probability quality, which a base-rate shift damages.",
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "postgres"
          },
          "gridPos": {
            "x": 12,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "postgres"
              },
              "rawSql": "SELECT r.ts AS time, m.role || ' v' || m.model_version AS metric, m.brier FROM monitor_model m JOIN monitor_runs r ON r.id = m.run_id WHERE m.brier IS NOT NULL AND $__timeFilter(r.ts) ORDER BY 1",
              "format": "time_series",
              "rawQuery": true,
              "editorMode": "code"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 0,
                "showPoints": "always"
              },
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 14,
          "type": "row",
          "title": "History",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 24,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 15,
          "type": "table",
          "title": "Monitor runs",
          "description": "",
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "postgres"
          },
          "gridPos": {
            "x": 0,
            "y": 25,
            "w": 24,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "postgres"
              },
              "rawSql": "SELECT ts, n_live AS live_stories, drifted_features, round(champion_roc_auc::numeric, 3) AS champion_roc_auc, round(champion_roc_auc_se::numeric, 3) AS roc_auc_se, n_graded, coalesce(reason, '') AS reason, action FROM monitor_runs ORDER BY ts DESC LIMIT 30",
              "format": "table",
              "rawQuery": true,
              "editorMode": "code"
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {
            "showHeader": true
          }
        },
        {
          "id": 16,
          "type": "row",
          "title": "Label audit (24-hour labels vs final scores)",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 33,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 17,
          "type": "table",
          "title": "Latest audits",
          "description": "Re-scores the champion's graded stories using today's HN score instead of the 24-hour score. late_risers are stories that crossed 100 points after the 24-hour label was written.",
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "postgres"
          },
          "gridPos": {
            "x": 0,
            "y": 34,
            "w": 24,
            "h": 6
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "postgres"
              },
              "rawSql": "SELECT ts, champion_version AS champion, n AS stories, hits_24h, hits_final, late_risers, round((100 * base_24h)::numeric, 2) AS hit_rate_24h_pct, round((100 * base_final)::numeric, 2) AS hit_rate_final_pct, round(auc_24h::numeric, 3) AS roc_auc_24h, round(auc_final::numeric, 3) AS roc_auc_final, round(auc_final_se::numeric, 3) AS se_final FROM label_audit ORDER BY ts DESC LIMIT 5",
              "format": "table",
              "rawQuery": true,
              "editorMode": "code"
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {
            "showHeader": true
          }
        }
      ]
    }
