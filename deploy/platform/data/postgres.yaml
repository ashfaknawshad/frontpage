apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg
spec:
  instances: 1
  storage:
    size: 5Gi
  postgresql:
    parameters:
      shared_buffers: "128MB"
      max_connections: "50"
      work_mem: "4MB"
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }
  bootstrap:
    initdb:
      database: frontpage
      owner: frontpage
      secret:
        name: pg-frontpage
  managed:
    roles:
      - name: mlflow
        ensure: present
        login: true
        passwordSecret:
          name: pg-mlflow
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: mlflow
spec:
  name: mlflow
  owner: mlflow
  cluster:
    name: pg
