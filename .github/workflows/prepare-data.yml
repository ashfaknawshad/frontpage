name: prepare-data

on:
  workflow_dispatch:
    inputs:
      start:
        description: First month (YYYY-MM)
        default: "2024-10"
      end:
        description: Last complete month (YYYY-MM)
        default: "2026-09"

permissions:
  contents: write

concurrency:
  group: prepare-data
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements-data.txt pytest && pip install -e .

      - name: Tests
        run: python -m pytest -q tests/test_prepare.py

      - name: Download, clean, validate
        run: python -m frontpage.data.prepare --start "${{ inputs.start }}" --end "${{ inputs.end }}"

      - name: Summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          s = json.load(open("data/hn_stories.stats.json"))
          print(f"### HN stories {s['first'][:10]} to {s['last'][:10]}")
          print(f"{s['rows']:,} stories, {s['months']} months. Reliable scores: {s['reliable_rows']:,} stories, "
                f"{100*s['reliable_positive_rate']:.2f}% reached 100 points\n")
          print("| Month | Stories | % >= 100 | Scores reliable |\n|---|---|---|---|")
          for m in s["per_month"]:
              flag = "yes" if m["reliable"] else "**no (stale)**"
              print(f"| {m['month']} | {m['stories']:,} | {100*m['positive_rate']:.2f} | {flag} |")
          PY

      - name: Version with DVC and push to DagsHub
        env:
          DAGSHUB_USER: ${{ secrets.DAGSHUB_USER }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          dvc remote modify origin --local auth basic
          dvc remote modify origin --local user "$DAGSHUB_USER"
          dvc remote modify origin --local password "$DAGSHUB_TOKEN"
          dvc add data/hn_stories.parquet
          dvc push
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hn_stories.parquet.dvc data/hn_stories.stats.json
          if git diff --cached --quiet; then
            echo "Data unchanged since the last run; nothing to commit."
            exit 0
          fi
          git commit -m "data: HN stories ${{ inputs.start }}..${{ inputs.end }} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
