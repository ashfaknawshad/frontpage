name: sync-aliases

on:
  push:
    branches: [main]
    paths:
      - "deploy/frontpage/serving/champion.yaml"
      - "deploy/frontpage/serving/challenger.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-aliases

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Make the MLflow aliases match Git
        run: python scripts/promote.py sync-aliases
