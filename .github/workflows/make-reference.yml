name: make-reference

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: make-reference
  cancel-in-progress: false

jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install pandas==3.0.5 pyarrow==25.0.1 numpy==2.5.3 pyyaml dvc==3.67.1 pytest

      - name: Unit tests
        run: python -m pytest -q tests/test_drift.py

      - name: Pull data from DagsHub
        env:
          DAGSHUB_USER: ${{ secrets.DAGSHUB_USER }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          dvc remote modify origin --local auth basic
          dvc remote modify origin --local user "$DAGSHUB_USER"
          dvc remote modify origin --local password "$DAGSHUB_TOKEN"
          dvc pull data/hn_stories.parquet.dvc

      - name: Build reference profile
        run: python -m frontpage.reference

      - name: Summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          s = json.load(open("jobs/reference.json"))
          print(f"### Reference profile\n{s['n']:,} training stories ({s['months'][0]} to {s['months'][1]}), "
                f"base rate {100 * s['base_rate']:.2f}%, data md5 `{s['data_md5']}`")
          PY

      - name: Commit and rebuild the jobs image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs/reference.json
          if git diff --cached --quiet; then echo "Reference unchanged."; exit 0; fi
          git commit -m "monitor: refresh reference profile [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
          gh workflow run build-jobs.yml --ref main
