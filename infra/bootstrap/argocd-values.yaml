global:
  domain: argocd.frontpage-ashfak.duckdns.org

configs:
  params:
    server.insecure: true

dex:
  enabled: false

notifications:
  enabled: false

applicationSet:
  replicas: 0

controller:
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }

repoServer:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 256Mi }

server:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 192Mi }
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    tls: true

redis:
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { memory: 128Mi }
