data:
  path: data/hn_stories.parquet
  train: ["2024-10", "2025-07"]
  val: ["2025-08", "2025-09"]
  test: ["2025-10", "2025-11"]

features:
  word_ngram_max: 2
  word_hash_bits: 20
  char_ngram: [3, 5]
  char_hash_bits: 20
  domain_min_count: 20

model:
  C: 0.5
  class_weight: balanced
  max_iter: 300

eval:
  top_k_per_day: 20

gate:
  min_lift_over_domain_baseline: 0.005

mlflow:
  experiment: frontpage
  registered_model: frontpage
